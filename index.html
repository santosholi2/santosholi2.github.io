<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap');

  :root{
    --bg:#0B0E14;
    --surface:#12161F;
    --surface-hover:#1A2029;
    --border:#232A36;
    --text:#E7ECF3;
    --muted:#7C8798;
    --accent:#5EEAD4;
    --accent-dim:#2E5F5A;
  }

  *{box-sizing:border-box;margin:0;padding:0;}

  html,body{
    height:100%;
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
  }

  body{
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    padding:24px;
    background-image:
      radial-gradient(circle at 20% 15%, rgba(94,234,212,0.06), transparent 40%),
      radial-gradient(circle at 80% 85%, rgba(94,234,212,0.04), transparent 40%);
  }

  .card{
    width:100%;
    max-width:420px;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:14px;
    overflow:hidden;
    box-shadow:0 20px 60px rgba(0,0,0,0.5);
  }

  .titlebar{
    display:flex;
    align-items:center;
    gap:8px;
    padding:12px 16px;
    background:#0E1117;
    border-bottom:1px solid var(--border);
  }

  .dot{width:10px;height:10px;border-radius:50%;}
  .dot.red{background:#FF5F56;}
  .dot.yellow{background:#FFBD2E;}
  .dot.green{background:#27C93F;}

  .titlebar span{
    margin-left:8px;
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    color:var(--muted);
  }

  .terminal{
    padding:28px 24px 8px;
    font-family:'IBM Plex Mono',monospace;
  }

  .prompt-line{
    font-size:14px;
    color:var(--muted);
    margin-bottom:6px;
  }
  .prompt-line .sym{color:var(--accent);}

  .name{
    font-size:28px;
    font-weight:700;
    letter-spacing:-0.02em;
    color:var(--text);
    margin-bottom:2px;
  }
  .name .cursor{
    display:inline-block;
    width:9px;
    height:22px;
    background:var(--accent);
    margin-left:4px;
    vertical-align:-3px;
    animation:blink 1.1s steps(1) infinite;
  }
  @keyframes blink{
    0%,49%{opacity:1;}
    50%,100%{opacity:0;}
  }

  .role{
    font-family:'Inter',sans-serif;
    font-size:13px;
    font-weight:500;
    color:var(--accent);
    margin-top:8px;
    letter-spacing:0.01em;
  }

  .tagline{
    font-family:'Inter',sans-serif;
    font-size:14px;
    color:var(--muted);
    margin-top:10px;
    margin-bottom:26px;
  }

  .links{
    display:flex;
    flex-direction:column;
    gap:10px;
    padding:0 16px 24px;
  }

  .link-row{
    display:flex;
    align-items:center;
    gap:12px;
    padding:14px 16px;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:10px;
    text-decoration:none;
    color:var(--text);
    transition:border-color .15s ease, background .15s ease, transform .15s ease;
  }

  .link-row:hover, .link-row:focus-visible{
    border-color:var(--accent-dim);
    background:var(--surface-hover);
    transform:translateX(2px);
    outline:none;
  }

  .icon{
    width:20px;
    height:20px;
    flex-shrink:0;
    color:var(--accent);
  }

  .link-text{
    flex:1;
    display:flex;
    flex-direction:column;
  }

  .link-cmd{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    color:var(--muted);
  }
  .link-cmd .sym{color:var(--accent);}

  .link-label{
    font-size:14px;
    font-weight:500;
    margin-top:2px;
  }

  .arrow{
    color:var(--muted);
    font-size:14px;
  }

  footer{
    text-align:center;
    padding:16px 0 22px;
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    color:#3A4150;
  }

  button.link-row{
    width:100%;
    border:1px solid var(--border);
    font:inherit;
    cursor:pointer;
  }

  @media (prefers-reduced-motion: reduce){
    .cursor{animation:none;opacity:1;}
  }
</style>
</head>
